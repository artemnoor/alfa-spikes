task: sentivent_unified_uie_sentence
dataset_path: GillesJacobs/sentivent
dataset_name: sentivent_unified_uie_sentence
validation_split: validation
test_split: test
output_type: generate_until
doc_to_text: |
  Extract SENTiVENT economic events and implicit sentiment in UIE spot-association format.
  Input:
  {{text}}
doc_to_target: "{{record}}"
generation_kwargs:
  until: []
  max_gen_toks: 1024
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
